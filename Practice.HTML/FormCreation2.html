<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="container">
        <h2>Registration Form</h2>
       <div class="form-container">
        <form>

            <div class="input-name ">
                <i class="fa fa-user"></i>
                <input type="text"placeholder="First Name" class="name">
            <span>
                <i class="fa fa-user"></i>
                <input type="text"placeholder="Last Name" class="name">
            </span>
            </div>

            <div class="input-name ">
                <i class="fa fa-envelope email"></i>
                <input type="email"placeholder="Email" class="text-name">
                
            </div>

            <div class="input-name ">
                <i class="fa fa-lock"></i>
                <input type="Cassword"placeholder="Password" class="text-name">
            </div>

            <div class="input-name ">
                <i class="fa fa-lock"></i>
                <input type="Confirm Password"placeholder="Confirm Password" class="text-name">
            </div>

            <div class="input-name ">
                <input type="radio" class="radio-button"name="r1">
                <label>Male</label>

                <input type="radio" class="radio-button"name="r1">
                <label>Female</label>
            
            <div class="input-name">
                <input type="Checkbox" class="checkbox">
                <label>Iaccept them term & condition</label>
            </div>

                <div class="input-name">
                    <input type="submit" class="button" value="Register">
                    
                </div>
        </form>
       </div> 

    </div>

</body>
</html>
