<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered and Unordered Lists</title>
</head>
<body>
    <!-- Ordered List -->
    <h2>Top 3 Programming Languages</h2>
    <ol>
        <li>Python</li>
        <li>JavaScript</li>
        <li>Java</li>
    </ol>

    <!-- Unordered List -->
    <h2>Grocery List</h2>
    <ul>
        <li>Apples</li>
        <li>Bread</li>
        <li>Milk</li>
        <li>Eggs</li>
    </ul>
</body>
</html>
