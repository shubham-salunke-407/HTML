<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image with Border</title>
    <style>
        .image-container img {
            border: 2px solid rgb(240, 232, 232);
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="Ocean images.jpeg" alt="Sample Image">
    </div>
</body>
</html>
