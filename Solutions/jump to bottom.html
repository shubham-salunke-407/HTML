<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jump to Bottom</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #bottom {
      margin-top: 100vh; /* Simulate a tall page */
    }
  </style>
</head>
<body>
  <!-- Link at the top -->
  <a href="#bottom">Jump to Bottom</a>

  <!-- Placeholder content -->
  <div id="content">
    <p>This is the top of the page.</p>
    <p>Scroll down or click the link to jump to the bottom.</p>
  </div>

  <!-- Bottom anchor -->
  <div id="bottom">
    <p>This is the bottom of the page.</p>
  </div>
</body>
</html>
